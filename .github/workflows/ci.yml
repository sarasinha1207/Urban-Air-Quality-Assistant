name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      # Production dependencies must be clean. Dev-only advisories with no published fix are tracked in the README.
      - run: npm audit --omit=dev --audit-level=low
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
